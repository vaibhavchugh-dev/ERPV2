name: Deploy API and UI via FTP

on:
  push:
    branches:
      - main
    paths:
      - "Cimmple_API/**"
      - "Cimmple_UI/**"
      - "Cimmple_PWA/**"
      - "Cimmple_VPA/**"
      - "Cimmple_Punch/**"
      - ".github/workflows/deploy-ftp.yml"
      - ".github/scripts/ftp_upload.py"
  workflow_dispatch:

concurrency:
  group: deploy-ftp-main
  cancel-in-progress: false

env:
  DOTNET_VERSION: 7.0.x
  NODE_VERSION: "20"
  FTP_PROTOCOL: ftp
  FTP_API_SERVER_DEFAULT: 108.181.155.217
  FTP_UI_SERVER_DEFAULT: 108.181.155.217
  FTP_API_USERNAME_DEFAULT: erpapi
  FTP_UI_USERNAME_DEFAULT: erpui
  FTP_PWA_USERNAME_DEFAULT: erpshop
  FTP_VPA_USERNAME_DEFAULT: erpvendor
  FTP_PUNCH_USERNAME_DEFAULT: erppunch

jobs:
  changes:
    name: Detect committed apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      ui: ${{ steps.pick.outputs.ui }}
      pwa: ${{ steps.pick.outputs.pwa }}
      vpa: ${{ steps.pick.outputs.vpa }}
      punch: ${{ steps.pick.outputs.punch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths in this push
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'Cimmple_API/**'
            ui:
              - 'Cimmple_UI/**'
            pwa:
              - 'Cimmple_PWA/**'
            vpa:
              - 'Cimmple_VPA/**'
            punch:
              - 'Cimmple_Punch/**'

      - name: Choose apps to release
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "pwa=true" >> "$GITHUB_OUTPUT"
            echo "vpa=true" >> "$GITHUB_OUTPUT"
            echo "punch=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "ui=${{ steps.filter.outputs.ui }}" >> "$GITHUB_OUTPUT"
            echo "pwa=${{ steps.filter.outputs.pwa }}" >> "$GITHUB_OUTPUT"
            echo "vpa=${{ steps.filter.outputs.vpa }}" >> "$GITHUB_OUTPUT"
            echo "punch=${{ steps.filter.outputs.punch }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-api:
    name: Build and FTP API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: |
          dotnet publish Cimmple_API/CimmpleAPI/CimmpleAPI.csproj \
            --configuration Release \
            --output artifacts/api \
            --no-self-contained
          rm -rf artifacts/api/_build_verify artifacts/api/_build_verify2 artifacts/api/_build_check artifacts/api/_build_out* artifacts/api/_build_support_check

      - name: Take API offline so IIS releases file locks
        env:
          FTP_SERVER: ${{ secrets.FTP_API_SERVER != '' && secrets.FTP_API_SERVER || env.FTP_API_SERVER_DEFAULT }}
          FTP_USER: ${{ secrets.FTP_API_USERNAME != '' && secrets.FTP_API_USERNAME || env.FTP_API_USERNAME_DEFAULT }}
          FTP_PASS: ${{ secrets.FTP_API_PASSWORD }}
        run: |
          printf 'updating\n' > app_offline.htm
          curl --silent --show-error --ftp-pasv \
            --user "${FTP_USER}:${FTP_PASS}" \
            -T app_offline.htm \
            "ftp://${FTP_SERVER}/app_offline.htm"
          sleep 10

      - name: Deploy API over FTP
        id: ftp-api-1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_API_SERVER != '' && secrets.FTP_API_SERVER || env.FTP_API_SERVER_DEFAULT }}
          username: ${{ secrets.FTP_API_USERNAME != '' && secrets.FTP_API_USERNAME || env.FTP_API_USERNAME_DEFAULT }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: ./artifacts/api/
          state-name: erp-api-ftp-sync-state.json
          log-level: standard
          timeout: 120000
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/_build*/**
            **/wwwroot/uploads/**
            **/appsettings.json
            **/appsettings.*.json
            **/*.pdb

      - name: Retry API FTP deploy
        if: steps.ftp-api-1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_API_SERVER != '' && secrets.FTP_API_SERVER || env.FTP_API_SERVER_DEFAULT }}
          username: ${{ secrets.FTP_API_USERNAME != '' && secrets.FTP_API_USERNAME || env.FTP_API_USERNAME_DEFAULT }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: ./artifacts/api/
          state-name: erp-api-ftp-sync-state.json
          log-level: standard
          timeout: 120000
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/_build*/**
            **/wwwroot/uploads/**
            **/appsettings.json
            **/appsettings.*.json
            **/*.pdb

      - name: Bring API back online
        if: success()
        env:
          FTP_SERVER: ${{ secrets.FTP_API_SERVER != '' && secrets.FTP_API_SERVER || env.FTP_API_SERVER_DEFAULT }}
          FTP_USER: ${{ secrets.FTP_API_USERNAME != '' && secrets.FTP_API_USERNAME || env.FTP_API_USERNAME_DEFAULT }}
          FTP_PASS: ${{ secrets.FTP_API_PASSWORD }}
        run: |
          curl --silent --show-error --ftp-pasv \
            --user "${FTP_USER}:${FTP_PASS}" \
            "ftp://${FTP_SERVER}/" \
            -Q "DELE app_offline.htm"

  deploy-ui:
    name: Build and FTP UI
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Cimmple_UI/package-lock.json

      - name: Install and build UI
        working-directory: Cimmple_UI
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI: false
        run: |
          npm ci
          npm run build

      - name: Deploy UI over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_UI_SERVER != '' && secrets.FTP_UI_SERVER || env.FTP_UI_SERVER_DEFAULT }}
          FTP_USER: ${{ secrets.FTP_UI_USERNAME != '' && secrets.FTP_UI_USERNAME || env.FTP_UI_USERNAME_DEFAULT }}
          FTP_PASS: ${{ secrets.FTP_UI_PASSWORD }}
          LOCAL_DIR: Cimmple_UI/build
          REMOTE_DIR: .
        run: python .github/scripts/ftp_upload.py

  deploy-pwa:
    name: Build and FTP Shop PWA
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Cimmple_PWA/package-lock.json

      - name: Install and build PWA
        working-directory: Cimmple_PWA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI: false
        run: |
          npm ci
          npm run build

      - name: Deploy PWA over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_UI_SERVER != '' && secrets.FTP_UI_SERVER || env.FTP_UI_SERVER_DEFAULT }}
          FTP_USER: ${{ secrets.FTP_PWA_USERNAME != '' && secrets.FTP_PWA_USERNAME || env.FTP_PWA_USERNAME_DEFAULT }}
          FTP_PASS: ${{ secrets.FTP_UI_PASSWORD }}
          LOCAL_DIR: Cimmple_PWA/dist
          REMOTE_DIR: .
        run: python .github/scripts/ftp_upload.py

  deploy-vpa:
    name: Build and FTP Vendor portal
    needs: changes
    if: needs.changes.outputs.vpa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Cimmple_VPA/package-lock.json

      - name: Install and build VPA
        working-directory: Cimmple_VPA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI: false
        run: |
          npm ci
          npm run build

      - name: Deploy VPA over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_UI_SERVER != '' && secrets.FTP_UI_SERVER || env.FTP_UI_SERVER_DEFAULT }}
          FTP_USER: ${{ secrets.FTP_VPA_USERNAME != '' && secrets.FTP_VPA_USERNAME || env.FTP_VPA_USERNAME_DEFAULT }}
          FTP_PASS: ${{ secrets.FTP_UI_PASSWORD }}
          LOCAL_DIR: Cimmple_VPA/dist
          REMOTE_DIR: .
        run: python .github/scripts/ftp_upload.py

  deploy-punch:
    name: Build and FTP Punch
    needs: changes
    if: needs.changes.outputs.punch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Cimmple_Punch/package-lock.json

      - name: Install and build Punch
        working-directory: Cimmple_Punch
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI: false
        run: |
          npm ci
          npm run build

      - name: Deploy Punch over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_UI_SERVER != '' && secrets.FTP_UI_SERVER || env.FTP_UI_SERVER_DEFAULT }}
          FTP_USER: ${{ secrets.FTP_PUNCH_USERNAME != '' && secrets.FTP_PUNCH_USERNAME || env.FTP_PUNCH_USERNAME_DEFAULT }}
          FTP_PASS: ${{ secrets.FTP_UI_PASSWORD }}
          LOCAL_DIR: Cimmple_Punch/dist
          REMOTE_DIR: .
        run: python .github/scripts/ftp_upload.py
